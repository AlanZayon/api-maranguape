services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - ASPNETCORE_ENVIRONMENT=Development
      - MONGO_CONNECTING_FUNCIONARIOS=mongodb://mongo:27017/funcionarios
      - JWT_SECRET=dev_jwt_secret_change_me
      - JWT_EXPIRES_IN=24h
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGINS=http://master.localhost:5173,http://demo.localhost:5173
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: '512M'

  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: '512M'

  redis:
    image: redis:7
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: '256M'

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - '8080:80'
    depends_on:
      - app
    networks:
      - app-network

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge
