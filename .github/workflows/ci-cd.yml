name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "echo 'db.runCommand({ ping: 1 })' | mongosh --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Organograma.slnx

      - name: Build
        run: dotnet build Organograma.slnx --configuration Release --no-restore

      - name: Test
        env:
          MONGO_CONNECTING_FUNCIONARIOS: mongodb://localhost:27017/funcionarios_ci
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: ci-test-secret-not-for-production
          JWT_EXPIRES_IN: 1h
          ASPNETCORE_ENVIRONMENT: Development
        run: dotnet test Organograma.slnx --configuration Release --no-build --verbosity normal

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          curl -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -d '{"branch": "main"}' \
            https://api.onrender.com/v1/services/srv-cu73jaq3esus73ffmn4g/deploy
